<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="choices-container">
        <div class="rock">✊</div>
        <div class="paper">🖐️</div>
        <div class="scissors">✌️</div>
    </div>
    <div class="scoreboard">
        <h1>Round <span class="round"></span></h1>
        <h1>Computer pick: <span class="computerPick"></span></h1>
        <div class="scores">
            <h1>You: <span class="userScore"></span></h1>
            <h1>Computer: <span class="computerScore"></span></h1>
        </div>
    </div>
    <button>Restart Game</button>
    <script src="script.js"></script>
</body>
</html>
